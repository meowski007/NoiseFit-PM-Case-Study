# Single Source of Truth for the NoiseFit Sync Center Business Case Financial Model
# Monetary unit for model calculations: INR Lakhs (1 Lakh = INR 100,000; 100 Lakhs = INR 1 Crore)
# Every unverified operational input is explicitly marked status: ASSUMPTION with Low / Base / High bounds.
# Note on Scenario Polarity:
#   - low:  Conservative / Pessimistic business outcome (lower benefits, higher effort/cost & discount rate)
#   - base: Expected / Central operating case
#   - high: Optimistic business outcome (higher benefits, leaner effort/cost & lower discount rate)

metadata:
  feature_name: "NoiseFit Sync Center"
  currency: "INR Lakhs"
  horizon_years: 3
  fx_note: "1 USD = INR 85 (ASSUMPTION)"

