<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<rect width="390" height="844" fill="#F6F8FB"/>
<!-- status bar -->
<text x="24" y="30" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#142034">9:41</text>
<text x="350" y="30" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#536174">● ● ▰</text>
<!-- app header -->
<rect x="0" y="48" width="390" height="70" fill="#FFFFFF"/>
<text x="24" y="78" font-family="Inter,Arial,sans-serif" font-size="12" fill="#6B7789">NoiseFit</text>
<text x="24" y="101" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750" fill="#142034">Sync Center</text>
<text x="366" y="92" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#2F67DA">⌄</text>
<!-- content -->

<rect x="20" y="136" width="350" height="154" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
<circle cx="195" cy="177" r="25" fill="#EEF3FF"/>
<circle cx="195" cy="177" r="16" fill="none" stroke="#2F67DA" stroke-width="4" stroke-dasharray="18 10"/>
<text x="195" y="220" text-anchor="middle" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#142034">Syncing your watch data</text>
<text x="195" y="244" text-anchor="middle" font-family="Inter,Arial" font-size="12" fill="#687384">Keep your watch nearby while we sync.</text>
<text x="195" y="267" text-anchor="middle" font-family="Inter,Arial" font-size="11" fill="#2F67DA">Started 9:41 AM</text>
<text x="20" y="322" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#142034">Sync progress</text>
<rect x="20" y="338" width="350" height="188" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
<text x="44" y="370" font-family="Inter,Arial" font-size="12" fill="#687384">Steps</text><text x="342" y="370" text-anchor="end" font-family="Inter,Arial" font-size="12" font-weight="700" fill="#198754">Synced</text>
<line x1="44" y1="388" x2="342" y2="388" stroke="#E7ECF3"/>
<text x="44" y="421" font-family="Inter,Arial" font-size="12" fill="#687384">Sleep</text><text x="342" y="421" text-anchor="end" font-family="Inter,Arial" font-size="12" fill="#2F67DA">Syncing…</text>
<line x1="44" y1="439" x2="342" y2="439" stroke="#E7ECF3"/>
<text x="44" y="472" font-family="Inter,Arial" font-size="12" fill="#687384">Workouts</text><text x="342" y="472" text-anchor="end" font-family="Inter,Arial" font-size="12" fill="#2F67DA">Syncing…</text>
<line x1="44" y1="490" x2="342" y2="490" stroke="#E7ECF3"/>
<text x="44" y="517" font-family="Inter,Arial" font-size="12" fill="#687384">Health metrics</text><text x="342" y="517" text-anchor="end" font-family="Inter,Arial" font-size="12" fill="#687384">Waiting</text>
<text x="20" y="564" font-family="Inter,Arial" font-size="11" fill="#687384">You can continue using NoiseFit while syncing.</text>

<!-- bottom navigation -->
<rect x="0" y="780" width="390" height="64" fill="#FFFFFF" stroke="#E6EBF2"/>
<text x="58" y="807" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#2F67DA">⌂</text>
<text x="58" y="827" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#2F67DA">Home</text>
<text x="195" y="807" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#142034">↻</text>
<text x="195" y="827" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#142034">Sync</text>
<text x="332" y="807" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#536174">⚙</text>
<text x="332" y="827" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#536174">Settings</text>
<!-- screen marker -->
<text x="366" y="765" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9AA5B5">Screen 2/8</text>
</svg>