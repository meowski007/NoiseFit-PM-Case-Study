<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<rect width="390" height="844" fill="#F6F8FB"/>
<!-- status bar -->
<text x="24" y="30" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#142034">9:41</text>
<text x="350" y="30" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#536174">● ● ▰</text>
<!-- app header -->
<rect x="0" y="48" width="390" height="70" fill="#FFFFFF"/>
<text x="24" y="78" font-family="Inter,Arial,sans-serif" font-size="12" fill="#6B7789">NoiseFit</text>
<text x="24" y="101" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750" fill="#142034">Sync Details</text>
<text x="366" y="92" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#2F67DA">⌄</text>
<!-- content -->

<rect x="20" y="136" width="350" height="164" rx="18" fill="#FFF4F3" stroke="#F1C7C3"/>
<circle cx="58" cy="178" r="19" fill="#FFE2DF"/>
<text x="58" y="185" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#C0392B">×</text>
<text x="88" y="170" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#142034">Sleep data couldn't sync</text>
<text x="88" y="195" font-family="Inter,Arial" font-size="12" fill="#687384">Your watch is connected, but the transfer</text>
<text x="88" y="214" font-family="Inter,Arial" font-size="12" fill="#687384">didn't finish.</text>
<text x="88" y="239" font-family="Inter,Arial" font-size="11" fill="#687384">Last successful sleep sync · 8:42 PM</text>
<text x="20" y="328" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#142034">Try this</text>
<rect x="20" y="344" width="350" height="170" rx="18" fill="#FFFFFF" stroke="#E3E8F0"/>
<text x="44" y="377" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#142034">1. Retry the sync</text>
<text x="44" y="399" font-family="Inter,Arial" font-size="11" fill="#687384">We’ll attempt the transfer again.</text>
<text x="44" y="434" font-family="Inter,Arial" font-size="13" font-weight="700" fill="#142034">2. Reconnect your watch</text>
<text x="44" y="456" font-family="Inter,Arial" font-size="11" fill="#687384">Use guided Bluetooth recovery if retry fails.</text>
<rect x="44" y="474" width="112" height="30" rx="15" fill="#2F67DA"/>
<text x="100" y="494" text-anchor="middle" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#FFFFFF">Retry sync</text>
<text x="20" y="554" font-family="Inter,Arial" font-size="11" fill="#687384">Need help? View troubleshooting steps.</text>

<!-- bottom navigation -->
<rect x="0" y="780" width="390" height="64" fill="#FFFFFF" stroke="#E6EBF2"/>
<text x="58" y="807" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#2F67DA">⌂</text>
<text x="58" y="827" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#2F67DA">Home</text>
<text x="195" y="807" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#142034">↻</text>
<text x="195" y="827" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#142034">Sync</text>
<text x="332" y="807" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#536174">⚙</text>
<text x="332" y="827" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#536174">Settings</text>
<!-- screen marker -->
<text x="366" y="765" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9AA5B5">Screen 4/8</text>
</svg>